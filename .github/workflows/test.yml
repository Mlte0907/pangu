# 盘古 — 测试工作流
# =====================
# 多平台 / 多 Python 版本测试

name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 2026-09-26 实测：全套（含 test_bench.py）在本机 14 分 27 秒跑完、1926 passed。
    # 此前这里是 30 分钟，而当时全套要 41 分半且有 1 个失败 —— **每次都跑到一半被杀**，
    # 等于「一直在跑但永远跑不完」，也就是全量从未真正被验证过。
    # 60 分钟给 GitHub runner（通常比本机慢 2~3 倍，且允许下载模型）留足余量。
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 单元测试
        run: |
          pytest tests/ -v --tb=short \
            --cov=pangu \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: 上传覆盖率
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
