# 临时探针：验证 ubuntu-24.04-arm runner 在本仓库能否被调度。
# 验证完成后删除本文件。
name: arm-probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: ARM runner 调度探针
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 确认架构与 Python
        run: |
          echo "uname -m      = $(uname -m)"
          echo "runner arch   = ${{ runner.arch }}"
          python3 -V || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 确认 Python 架构
        run: python -c "import platform; print('platform.machine() =', platform.machine())"

      - name: 安装 onnxruntime 并确认可用（真正的架构敏感点）
        run: |
          pip install --quiet onnxruntime
          python -c "
          import onnxruntime as ort, platform
          print('arch:', platform.machine())
          print('onnxruntime:', ort.__version__)
          print('providers:', ort.get_available_providers())
          "
