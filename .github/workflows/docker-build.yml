# 盘古 — Docker 多架构构建与发布
# ==================================
# 触发：tag 推送（v*）→ 构建并推送多架构镜像
# 手动触发：workflow_dispatch

name: Docker Build

on:
  push:
    tags:
      - "v*.*.*"
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag"
        default: "dev"
        required: false

env:
  REGISTRY: ghcr.io
  # 注意：${{ github.repository }} 保留仓库名原始大小写（本仓库为
  # Mlte0907/pangu），仅可用于 metadata-action 的 images 参数——它会
  # 自行转小写。需要显式镜像引用的步骤（如 Trivy）不要拼这个变量，
  # 否则 OCI 会拒绝 "ghcr.io/Mlte0907/pangu:latest"（引用必须全小写），
  # 而应改用 steps.meta.outputs.tags。
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送（多架构）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 解析供扫描用的镜像引用
        id: scanref
        # metadata-action 对仓库名做了小写化，而显式拼接 env.IMAGE_NAME
        # 会保留原始大小写（Mlte0907/pangu）。OCI 引用必须全小写，否则
        # Trivy 报 "could not parse reference"，故从 metadata 的真实输出
        # 中取扫描目标。优先取 :latest（与本步骤原本的意图一致），
        # 无 latest 时退化为第一条。该步骤只做字符串处理，无副作用。
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          REF=$(printf '%s\n' "$TAGS" | grep -m1 ':latest$' || true)
          if [ -z "$REF" ]; then
            REF=$(printf '%s\n' "$TAGS" | head -n1)
          fi
          if [ -z "$REF" ]; then
            echo "::error::metadata 未产出任何 tag，无法确定扫描目标"
            exit 1
          fi
          echo "扫描目标: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: 镜像扫描（Trivy）
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: 上传扫描结果
        if: github.event_name != 'pull_request' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          # 扫描失败时无文件可传，跳过而非让本步骤也报错、掩盖真正原因
          continue-on-error: true
