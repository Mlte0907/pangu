<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘古 — 专业记忆系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">盘 古</h1>
                <span class="subtitle">专业记忆系统</span>
            </div>

            <!-- 系统指标进度条 -->
            <div class="sidebar-metrics">
                <div class="metric-row">
                    <div class="metric-label"><span class="metric-dot dot-purple"></span> 记忆容量</div>
                    <div class="metric-num" id="sm-mem-count">0</div>
                    <div class="progress-bar"><div class="progress-fill progress-purple" id="sm-mem-bar" style="width:0%"></div></div>
                </div>
                <div class="metric-row">
                    <div class="metric-label"><span class="metric-dot dot-green"></span> 健康度</div>
                    <div class="metric-num" id="sm-health-score">--</div>
                    <div class="progress-bar"><div class="progress-fill progress-green" id="sm-health-bar" style="width:0%"></div></div>
                </div>
                <div class="metric-row">
                    <div class="metric-label"><span class="metric-dot dot-blue"></span> 模型用量</div>
                    <div class="metric-num" id="sm-model-usage">0</div>
                    <div class="progress-bar"><div class="progress-fill progress-blue" id="sm-model-bar" style="width:0%"></div></div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <h3>导航</h3>
                    <a href="#" class="nav-item active" data-view="dashboard">
                        <span class="icon">🏠</span> 仪表盘
                    </a>
                    <a href="#" class="nav-item" data-view="knowledge">
                        <span class="icon">🧩</span> 知识总览
                    </a>
                    <a href="#" class="nav-item" data-view="memories">
                        <span class="icon">🧠</span> 记忆库
                    </a>
                    <a href="#" class="nav-item" data-view="timeline">
                        <span class="icon">📅</span> 时间线
                    </a>
                    <a href="#" class="nav-item" data-view="wiki">
                        <span class="icon">📚</span> 知识 Wiki
                    </a>
                </div>

                <div class="nav-section">
                    <h3>空间</h3>
                    <div id="wings-list">
                        <a href="#" class="nav-item wing-item" data-wing="default">
                            <span class="icon">📁</span> default
                        </a>
                    </div>
                </div>

                <div class="nav-section">
                    <h3>系统</h3>
                    <a href="#" class="nav-item" data-view="settings">
                        <span class="icon">⚙️</span> 设置
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <span class="version">v0.2.0</span>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main id="main-content">
            <!-- 仪表盘 -->
            <div id="view-dashboard" class="view active">
                <div class="view-header">
                    <h2>仪表盘</h2>
                    <div class="header-actions">
                        <button class="btn btn-primary" id="quick-mine-btn">📥 快速挖掘</button>
                        <button class="btn btn-outline" id="refresh-stats-btn">🔄 刷新</button>
                    </div>
                </div>

                <div class="stats-grid" id="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-wings">-</div>
                        <div class="stat-label">空间 (Wings)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-drawers">-</div>
                        <div class="stat-label">记忆片段</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-wiki-pages">-</div>
                        <div class="stat-label">Wiki 页面</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-kg-entities">-</div>
                        <div class="stat-label">知识实体</div>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="card">
                        <h3>🧠 唤醒上下文</h3>
                        <div id="wake-up-content" class="markdown-content">
                            <p class="placeholder">加载中...</p>
                        </div>
                    </div>
                    <div class="card">
                        <h3>📝 最近记忆</h3>
                        <div id="recent-memories" class="list-content">
                            <p class="placeholder">加载中...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 知识总览（顶部标签页：图谱 + 知识卡片） -->
            <div id="view-knowledge" class="view">
                <div class="view-header">
                    <h2>知识总览</h2>
                </div>
                <!-- 顶部标签栏 -->
                <div class="tab-bar">
                    <button class="tab-btn active" data-tab="tab-graph">🔗 知识图谱</button>
                    <button class="tab-btn" data-tab="tab-cards">🗂 知识卡片</button>
                </div>
                <!-- 图谱面板 -->
                <div class="tab-panel active" id="tab-graph">
                    <div class="graph-toolbar">
                        <input class="graph-search" id="graph-search" placeholder="搜索实体...">
                        <button class="btn btn-sm btn-outline" id="graph-zoom-in-btn">🔍+</button>
                        <button class="btn btn-sm btn-outline" id="graph-zoom-out-btn">🔍-</button>
                        <button class="btn btn-sm btn-outline" id="graph-reset-btn">🔄 重置</button>
                        <span class="graph-stats" id="graph-stats"></span>
                    </div>
                    <div class="graph-canvas-wrap">
                        <canvas id="knowledge-canvas"></canvas>
                        <div class="graph-legend" id="graph-legend"></div>
                        <div class="graph-sidebar" id="graph-sidebar">
                            <span class="close-btn" onclick="closeGraphSidebar()">×</span>
                            <div id="graph-sidebar-content"></div>
                        </div>
                    </div>
                </div>
                <!-- 知识卡片面板 -->
                <div class="tab-panel" id="tab-cards">
                    <div class="cards-toolbar">
                        <input class="graph-search" id="card-search" placeholder="搜索知识卡片...">
                        <select id="card-type-filter" class="card-filter-select">
                            <option value="">全部类型</option>
                            <option value="person">人物</option>
                            <option value="org">组织</option>
                            <option value="tech">技术</option>
                            <option value="concept">概念</option>
                            <option value="event">事件</option>
                            <option value="memory">记忆</option>
                        </select>
                    </div>
                    <div class="knowledge-cards-grid" id="knowledge-cards-grid">
                        <p class="placeholder">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 记忆库 -->
            <div id="view-memories" class="view">
                <div class="view-header">
                    <h2>记忆库</h2>
                    <div class="header-actions">
                        <button class="btn btn-primary" id="add-memory-btn">+ 添加记忆</button>
                        <button class="btn btn-outline" id="mine-files-btn">📂 挖掘文件</button>
                    </div>
                </div>

                <div class="filters">
                    <select id="memory-wing-filter">
                        <option value="">所有空间</option>
                    </select>
                    <input type="text" id="memory-search" placeholder="搜索记忆..." class="search-input">
                </div>

                <div id="memories-list" class="list-content">
                    <p class="placeholder">加载中...</p>
                </div>
            </div>

            <!-- 时间线 -->
            <div id="view-timeline" class="view">
                <div class="view-header">
                    <h2>时间线</h2>
                    <div class="header-actions">
                        <select id="timeline-range">
                            <option value="1d">最近1天</option>
                            <option value="7d" selected>最近7天</option>
                            <option value="30d">最近30天</option>
                            <option value="all">全部</option>
                        </select>
                    </div>
                </div>
                <div id="timeline-container" class="timeline-container">
                    <div id="timeline-line"></div>
                    <div id="timeline-events"></div>
                </div>
            </div>

            <!-- 知识 Wiki -->
            <div id="view-wiki" class="view">
                <div class="view-header">
                    <h2>知识 Wiki</h2>
                    <div class="header-actions">
                        <button class="btn btn-primary" id="create-wiki-btn">+ 新建页面</button>
                        <button class="btn btn-outline" id="generate-wiki-btn">🤖 自动生成</button>
                    </div>
                </div>
                <div id="wiki-pages-list" class="wiki-grid">
                    <p class="placeholder">加载中...</p>
                </div>
            </div>

            <!-- 设置（仅保留记忆系统开关与参数） -->
            <div id="view-settings" class="view">
                <div class="view-header"><h2>设置</h2></div>
                <div class="settings-content">
                    <div class="card">
                        <h3>⚙️ 记忆系统参数</h3>
                        <div id="memory-settings-form" class="form-content"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 模态框 -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal" id="modal-content"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
